apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app-blue
spec:
  replicas: 1

  selector:
    matchLabels:
      app: sample-app
      slot: blue

  template:
    metadata:
      labels:
        app: sample-app
        slot: blue

    spec:
      containers:
      - name: sample-app
        image: 10.30.10.244/image-build/sample-app:17
        imagePullPolicy: Always

        ports:
        - containerPort: 8080
